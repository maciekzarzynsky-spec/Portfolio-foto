<!DOCTYPE html>

<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fotografia uliczna | Maciej Zarzyński</title>
    <meta name="description" content="Fotografia uliczna Macieja Zarzyńskiego. Kadry z ulic, podróży i codziennych sytuacji uchwycone w naturalnym środowisku.">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Nagłówek galerii -->

    <section class="gallery-page">

        <a href="index.html#portfolio" class="btn">← Powrót</a>

        <p>

        </p>

        <!-- Galeria -->

        <div class="gallery">

            <img src="images/Street/Street-1.jpg" alt="Fotografia uliczna">

            <img src="images/Street/Street-2.jpg" alt="Fotografia uliczna">

            <img src="images/Street/Street-3.jpg" alt="Fotografia uliczna">

        <button class="lightbox-next" id="lightbox-next">
